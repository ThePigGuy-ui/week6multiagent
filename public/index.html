<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Agent Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="theme-dark">
    <div class="app-shell">
      <aside class="sidebar" id="agent-panel">
        <div class="sidebar-header">
          <h2>Agents</h2>
          <button id="agent-toggle" class="toggle-button" type="button" aria-pressed="true">
            On
          </button>
        </div>

        <div id="agent-list" class="agent-list">
          <button class="agent-item live" type="button" data-agent="comedian" aria-pressed="true">
            <span class="agent-dot comedian-dot"></span>
            <span>Comedian</span>
          </button>
          <button class="agent-item live" type="button" data-agent="scientist" aria-pressed="true">
            <span class="agent-dot scientist-dot"></span>
            <span>Scientist</span>
          </button>
          <button class="agent-item live" type="button" data-agent="inspector" aria-pressed="true">
            <span class="agent-dot inspector-dot"></span>
            <span>Inspector</span>
          </button>
        </div>
      </aside>

      <section class="chat-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Multi-agent demo</p>
            <h1>Orchestrator Chat</h1>
          </div>

          <div class="topbar-actions">
            <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme">🌙</button>
            <button id="clear-history" class="ghost-button" type="button">Clear</button>
            <div id="status" class="status-badge">Connecting...</div>
          </div>
        </header>

        <main id="chat" class="chat-window" aria-live="polite"></main>

        <form id="chat-form" class="composer">
          <textarea
            id="message-input"
            rows="1"
            placeholder="Type your message..."
            aria-label="Type your message"
          ></textarea>
          <button id="send-button" type="submit">Send</button>
        </form>
      </section>

      <aside class="trace-panel" aria-live="polite">
        <div class="api-key-section">
          <label for="api-key-input">Vibe Proxy Key:</label>
          <input type="password" id="api-key-input" placeholder="Server default is configured" />
          <button id="connect-button" type="button" class="connect-button">Connect</button>
          <div id="connection-status" class="connection-status success">Vibe proxy ready</div>
        </div>

        <div class="panel-section">
          <label for="universe-select">Agent Universe</label>
          <select id="universe-select">
            <option value="default">Core Crew</option>
            <option value="game">Game Designer Team</option>
            <option value="space">Space Mission Crew</option>
            <option value="superhero">Superhero Squad</option>
            <option value="animal">Animal Rescue Team</option>
          </select>
        </div>

        <h3>Agent Trace</h3>
        <div class="trace-card">
          <p class="trace-label">Prompt</p>
          <p id="trace-prompt" class="trace-value">No prompt yet</p>
        </div>
        <div class="trace-card">
          <p class="trace-label">Triggered</p>
          <p id="trace-agent" class="trace-value">Waiting...</p>
        </div>
      </aside>
    </div>

    <script src="/app.js"></script>
  </body>
</html>

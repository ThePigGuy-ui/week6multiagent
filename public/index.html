<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple LLM Chat</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="agent-panel">
        <div class="sidebar-header">
          <h2>Agents</h2>
          <button id="agent-toggle" class="toggle-button" type="button" aria-pressed="true">
            On
          </button>
        </div>

        <div id="agent-list" class="agent-list">
          <button class="agent-item live" type="button" data-agent="comedian" aria-pressed="true">
            <span class="agent-dot"></span>
            <span>Comedian</span>
          </button>
          <button class="agent-item live" type="button" data-agent="scientist" aria-pressed="true">
            <span class="agent-dot"></span>
            <span>Scientist</span>
          </button>
          <button class="agent-item live" type="button" data-agent="inspector" aria-pressed="true">
            <span class="agent-dot"></span>
            <span>Inspector</span>
          </button>
        </div>
      </aside>

      <section class="chat-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Multi-agent demo</p>
            <h1>Orchestrator Chat</h1>
          </div>
          <div id="status" class="status-badge">Connecting...</div>
        </header>

        <main id="chat" class="chat-window" aria-live="polite"></main>

        <form id="chat-form" class="composer">
          <textarea
            id="message-input"
            rows="1"
            placeholder="Type your message..."
            aria-label="Type your message"
          ></textarea>
          <button id="send-button" type="submit">Send</button>
        </form>
      </section>

      <aside class="trace-panel" aria-live="polite">
        <div class="api-key-section">
          <label for="api-key-input">API Key:</label>
          <input type="password" id="api-key-input" placeholder="Enter your OpenAI API key" />
        </div>
        <h3>Agent Trace</h3>
        <div class="trace-card">
          <p class="trace-label">Prompt</p>
          <p id="trace-prompt" class="trace-value">No prompt yet</p>
        </div>
        <div class="trace-card">
          <p class="trace-label">Triggered</p>
          <p id="trace-agent" class="trace-value">Waiting...</p>
        </div>
      </aside>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
